[project]
name = "api"
version = "0.0.1"
description = "Add your description here"
authors = [{ name = "taktiks2" }]
readme = "README.md"
requires-python = ">= 3.8"
dependencies = ["fastapi>=0.111.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye.scripts]
dev = "uvicorn src.main:app --reload"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
